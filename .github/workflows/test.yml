name: Lint & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Ruff lint
        run: ruff check .

      - name: Syntax check
        run: python -m py_compile opusbook.py

      - name: Pytest
        run: pytest

      - name: CLI smoke (help + version + dry-run)
        run: |
          python opusbook.py --help
          python opusbook.py --version
          mkdir -p /tmp/opusbook-smoke && python opusbook.py /tmp/opusbook-smoke -b 64k --dry-run --keep
