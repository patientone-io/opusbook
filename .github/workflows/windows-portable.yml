name: Windows portable ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - name: Ensure patched Node 24 for JavaScript actions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worker = (Get-Process -Name Runner.Worker | Select-Object -First 1).Path
          $runner = Split-Path (Split-Path $worker)
          $node = Join-Path $runner 'externals/node24/bin/node.exe'
          $current = [version]((& $node --version).TrimStart('v'))
          if ($current -lt [version]'24.22.1') {
            $archive = Join-Path $env:RUNNER_TEMP 'node-v24.22.1-win-x64.zip'
            Invoke-WebRequest https://nodejs.org/dist/v24.22.1/node-v24.22.1-win-x64.zip -OutFile $archive
            $expected = 'd2046d28c2c3dcd211ac5145c0bf30e2047ef9dfb306693c8c6e2eccd8b95fa5'
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
              throw 'Node.js SHA-256 mismatch'
            }
            Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
            Copy-Item (Join-Path $env:RUNNER_TEMP 'node-v24.22.1-win-x64/node.exe') $node -Force
          }
          & $node --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller==6.22.0
      - name: Lint
        run: python -m ruff check .
      - name: Build portable ZIP with verified FFmpeg
        run: python packaging/build_windows.py
      - name: Extract final ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/opusbook-*-windows-x64.zip
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP/portable smoke"
          "$env:RUNNER_TEMP/portable smoke/opusbook" >> $env:GITHUB_PATH
      - name: Windows regression tests
        run: python -m pytest
      - name: Test extracted executable without installed tools on PATH
        run: python packaging/smoke_windows.py
      - name: Upload ZIP and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opusbook-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
