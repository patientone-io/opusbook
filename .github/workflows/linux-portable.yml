name: Linux portable archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure patched Node 24 for JavaScript actions
        shell: bash
        run: |
          set -euo pipefail
          worker_pid=$(pgrep -xo Runner.Worker)
          runner=$(dirname "$(dirname "$(readlink -f "/proc/$worker_pid/exe")")")
          node="$runner/externals/node24/bin/node"
          current=$("$node" --version)
          if [ "$(printf '%s\n' '24.22.1' "${current#v}" | sort -V | head -n 1)" != '24.22.1' ]; then
            archive="$RUNNER_TEMP/node-v24.22.1-linux-x64.tar.xz"
            curl --fail --location --retry 3 https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz -o "$archive"
            printf '%s  %s\n' '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6' "$archive" | sha256sum -c -
            tar -xJf "$archive" -C "$RUNNER_TEMP" node-v24.22.1-linux-x64/bin/node
            sudo install -m 755 "$RUNNER_TEMP/node-v24.22.1-linux-x64/bin/node" "$node"
          fi
          "$node" --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build on Debian 13 (glibc 2.41)
        run: |
          docker build -f packaging/Dockerfile.linux -t opusbook-build-linux packaging
          docker run --rm -v "$PWD:/src" opusbook-build-linux
      - name: Verify and extract final archive
        run: |
          cd dist
          sha256sum -c *.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/portable smoke"
          tar -xzf opusbook-*-linux-x64.tar.gz -C "$RUNNER_TEMP/portable smoke"
      - name: Smoke on Debian 13 baseline
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/portable smoke:/bundle:ro" \
            python:3.12-slim-trixie python /src/packaging/smoke_portable.py /bundle/opusbook/opusbook
      - name: Upload archive and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opusbook-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
